spring.application.name=portalempresa

# Base de datos H2 en memoria — los datos se pierden al reiniciar
spring.datasource.url=jdbc:h2:mem:portalempresa;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# create-drop: Hibernate crea las tablas al arrancar y las borra al cerrar
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Consola web de H2 en http://localhost:8080/h2-console
spring.h2.console.enabled=true

server.port=8080
